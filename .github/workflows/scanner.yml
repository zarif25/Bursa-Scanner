name: Bursa Scanner (Intraday)

on:
  # ------------------------------------------------------------------
  # PRIMARY trigger: cron-job.org -> GitHub repository_dispatch.
  # Tepat masa (biasanya < 1 min). Set cron-job.org pada 09:15-12:45 &
  # 14:15-16:45 MYT setiap 30 min, dan 17:15 MYT untuk EOD.
  #
  # Endpoint : POST https://api.github.com/repos/zarif25/Bursa-Scanner/dispatches
  # Headers  : Authorization: Bearer <PAT dengan scope repo/contents:write>
  #            Accept: application/vnd.github+json
  # Body     : {"event_type":"run-scan"}
  # ------------------------------------------------------------------
  repository_dispatch:
    types: [run-scan]

  # ------------------------------------------------------------------
  # BACKUP trigger: GitHub cron (UTC). Sengaja dianjak +10 min daripada
  # slot cron-job.org supaya ia hanya "menyelamat" jika primary tidak
  # jalan. GitHub cron boleh lewat/ditinggalkan ketika beban tinggi --
  # jangan bergantung padanya sebagai trigger utama.
  #
  # MYT  : 09:25 .. 12:55 dan 14:25 .. 16:55 (setiap 30 min), 17:25 EOD
  # UTC  : 01:25 .. 04:55 dan 06:25 .. 08:55,             09:25
  # ------------------------------------------------------------------
  schedule:
    - cron: "25,55 1-4,6-8 * * 1-5"
    - cron: "25 9 * * 1-5"

  # Manual run dari tab Actions
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass weekday/holiday/trading-hours check"
        required: false
        default: "false"

# Halang dua run bertindih (dispatch + schedule serentak).
# cancel-in-progress: false = run kedua tunggu, bukan batal.
concurrency:
  group: bursa-scanner
  cancel-in-progress: false

permissions:
  contents: write   # perlu untuk commit alerted_today.json balik ke repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log trigger source
        run: |
          echo "Trigger : ${{ github.event_name }}"
          echo "UTC now : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "MYT now : $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S')"

      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: python scanner.py

      # alerted_today.json (dedup) dan history_cache.csv/cache_meta.json
      # (baseline cache sekali sehari) mesti kekal antara run -- runner
      # adalah ephemeral, jadi commit balik ke repo.
      - name: Persist scanner state (dedup + history cache)
        if: always()
        run: |
          git config user.name "bursa-scanner-bot"
          git config user.email "actions@github.com"
          git add alerted_today.json history_cache.csv cache_meta.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scanner state (dedup / baseline cache) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          else
            echo "No state changes to commit."
          fi
