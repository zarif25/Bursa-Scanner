name: Bursa Scanner (Intraday)

on:
  schedule:
    # GitHub Actions cron is UTC. MYT = UTC+8.
    #
    # Morning session  : 09:15, 09:45, 10:15, 10:45, 11:15, 11:45, 12:15, 12:45 MYT
    #                  -> 01:15 .. 04:45 UTC
    # Afternoon session: 14:15, 14:45, 15:15, 15:45, 16:15, 16:45 MYT
    #                  -> 06:15 .. 08:45 UTC
    # Final EOD scan   : 17:15 MYT -> 09:15 UTC
    #
    # Note: GitHub cron can be delayed by several minutes at peak load.
    - cron: "15,45 1-4,6-8 * * 1-5"
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass weekday/holiday/trading-hours check"
        required: false
        default: "false"

concurrency:
  group: bursa-scanner
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit alerted_today.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python scanner.py

      # alerted_today.json (dedup) and history_cache.csv/cache_meta.json
      # (once-daily baseline cache) must persist between runs -- runners are
      # ephemeral, so commit them back to the repo. history_cache.csv only
      # actually changes on the first run of each calendar day; other runs
      # only touch alerted_today.json, so most commits here are small.
      - name: Persist scanner state (dedup + history cache)
        if: always()
        run: |
          git config user.name "bursa-scanner-bot"
          git config user.email "actions@github.com"
          git add alerted_today.json history_cache.csv cache_meta.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scanner state (dedup / baseline cache) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          else
            echo "No state changes to commit."
          fi
