name: Bursa Market Scanner — Saham Alert

on:
  repository_dispatch:
    types: [run-scan]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'Manual test'
  schedule:
    # Scheduled times in UTC (Malaysia Time is UTC+8)
    # 9:15 AM MYT -> 1:15 AM UTC
    - cron: '15 1 * * 1-5'
    # 9:45 AM MYT -> 1:45 AM UTC
    - cron: '45 1 * * 1-5'
    # 10:15 AM MYT -> 2:15 AM UTC
    - cron: '15 2 * * 1-5'
    # 10:45 AM MYT -> 2:45 AM UTC
    - cron: '45 2 * * 1-5'
    # 11:15 AM MYT -> 3:15 AM UTC
    - cron: '15 3 * * 1-5'
    # 11:45 AM MYT -> 3:45 AM UTC
    - cron: '45 3 * * 1-5'
    # 12:15 PM MYT -> 4:15 AM UTC
    - cron: '15 4 * * 1-5'
    # 12:45 PM MYT -> 4:45 AM UTC
    - cron: '45 4 * * 1-5'
    # 2:45 PM MYT -> 6:45 AM UTC
    - cron: '45 6 * * 1-5'
    # 3:15 PM MYT -> 7:15 AM UTC
    - cron: '15 7 * * 1-5'
    # 3:45 PM MYT -> 7:45 AM UTC
    - cron: '45 7 * * 1-5'
    # 4:15 PM MYT -> 8:15 AM UTC
    - cron: '15 8 * * 1-5'
    # 4:45 PM MYT -> 8:45 AM UTC
    - cron: '45 8 * * 1-5'

concurrency:
  group: bursa-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    name: Scan Bursa Malaysia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py

      - name: Commit dedup tracking file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain alerted_today.json)" ]; then
            echo "No changes to alerted_today.json"
            exit 0
          fi

          cp alerted_today.json /tmp/my_alerted.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import json

          with open("/tmp/my_alerted.json") as f:
              mine = json.load(f)
          with open("alerted_today.json") as f:
              remote = json.load(f)

          merged_alerted = sorted(set(mine.get("alerted", [])) | set(remote.get("alerted", [])))
          merged = {
              "date": mine.get("date") or remote.get("date"),
              "alerted": merged_alerted,
          }

          with open("alerted_today.json", "w") as f:
              json.dump(merged, f, indent=4)
              f.write("\n")
          PY

            if [ -z "$(git status --porcelain alerted_today.json)" ]; then
              echo "Already up to date after merge, nothing to push"
              exit 0
            fi

            git add alerted_today.json
            git commit -m "Update alerted_today.json [skip ci]"

            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi

            echo "Push attempt $attempt lost the race, retrying..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "::error::Failed to push alerted_today.json after 5 attempts"
          exit 1

      - name: Upload scan log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: scan-log-${{ github.run_id }}
          path: '*.log'
          retention-days: 7
